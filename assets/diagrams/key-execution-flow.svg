<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
<defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.decision{fill:#fff7ed;stroke:#fdba74;stroke-width:1.5}.deny{fill:#fef2f2;stroke:#fecaca;stroke-width:1.5}.ok{fill:#f0fdf4;stroke:#bbf7d0;stroke-width:1.5}.title{font:700 24px Arial,'Microsoft YaHei';fill:#0f172a}.h{font:700 16px Arial,'Microsoft YaHei';fill:#0f172a}.t{font:14px Arial,'Microsoft YaHei';fill:#334155}.m{font:12px Arial,'Microsoft YaHei';fill:#64748b}.line{stroke:#2563eb;stroke-width:2;fill:none}.green{stroke:#16a34a;stroke-width:2;fill:none}.red{stroke:#dc2626;stroke-width:2;fill:none}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs>
<rect class="bg" width="1500" height="920"/><text class="title" x="54" y="58">GSX Remote Agent — Key Execution Flow</text><text class="m" x="54" y="84">From AI tool call to local execution, approval and audit.</text>

<rect class="box" x="70" y="135" width="210" height="90" rx="10"/><text class="h" x="175" y="169" text-anchor="middle">1. AI Host</text><text class="t" x="175" y="196" text-anchor="middle">MCP Tool Call</text>
<rect class="box" x="335" y="135" width="230" height="90" rx="10"/><text class="h" x="450" y="169" text-anchor="middle">2. MCP Gateway</text><text class="t" x="450" y="194" text-anchor="middle">Schema · Session · Target</text>
<rect class="box" x="620" y="135" width="230" height="90" rx="10"/><text class="h" x="735" y="169" text-anchor="middle">3. Server Policy</text><text class="t" x="735" y="194" text-anchor="middle">Risk · Scope · Rule match</text>
<rect class="decision" x="905" y="125" width="230" height="110" rx="12"/><text class="h" x="1020" y="166" text-anchor="middle">4. Approval needed?</text><text class="t" x="1020" y="194" text-anchor="middle">Allow / Ask / Deny</text>
<rect class="box" x="1190" y="135" width="230" height="90" rx="10"/><text class="h" x="1305" y="169" text-anchor="middle">5. Request Router</text><text class="t" x="1305" y="194" text-anchor="middle">Route to online Agent</text>
<line class="line" x1="280" y1="180" x2="335" y2="180" marker-end="url(#a)"/><line class="line" x1="565" y1="180" x2="620" y2="180" marker-end="url(#a)"/><line class="line" x1="850" y1="180" x2="905" y2="180" marker-end="url(#a)"/><line class="green" x1="1135" y1="180" x2="1190" y2="180" marker-end="url(#g)"/><text class="m" x="1145" y="162">Allow</text>

<rect class="decision" x="890" y="300" width="260" height="105" rx="12"/><text class="h" x="1020" y="338" text-anchor="middle">User Approval</text><text class="t" x="1020" y="364" text-anchor="middle">Allow once / Deny</text><line class="line" x1="1020" y1="235" x2="1020" y2="300" marker-end="url(#a)"/><text class="m" x="1030" y="270">Ask</text>
<rect class="deny" x="585" y="300" width="230" height="105" rx="12"/><text class="h" x="700" y="338" text-anchor="middle">Reject Request</text><text class="t" x="700" y="364" text-anchor="middle">Permission denied + Audit</text>
<line class="red" x1="890" y1="353" x2="815" y2="353" marker-end="url(#r)"/><text class="m" x="832" y="338">Deny</text><path class="green" d="M1150 352 C1260 352,1305 300,1305 225" marker-end="url(#g)"/><text class="m" x="1176" y="330">Allow once</text>

<rect class="box" x="1190" y="485" width="230" height="95" rx="10"/><text class="h" x="1305" y="520" text-anchor="middle">6. GSX Agent</text><text class="t" x="1305" y="546" text-anchor="middle">Receive execution.request</text><line class="line" x1="1305" y1="225" x2="1305" y2="485" marker-end="url(#a)"/>
<rect class="decision" x="905" y="480" width="230" height="105" rx="12"/><text class="h" x="1020" y="518" text-anchor="middle">7. Local Policy Check</text><text class="t" x="1020" y="544" text-anchor="middle">Second enforcement</text><line class="line" x1="1190" y1="532" x2="1135" y2="532" marker-end="url(#a)"/>
<rect class="box" x="620" y="485" width="230" height="95" rx="10"/><text class="h" x="735" y="520" text-anchor="middle">8. Capability Router</text><text class="t" x="735" y="546" text-anchor="middle">Files · Shell · Browser · GUI</text><line class="green" x1="905" y1="532" x2="850" y2="532" marker-end="url(#g)"/><text class="m" x="862" y="514">Allow</text>
<path class="red" d="M1020 585 C1020 650,820 650,770 405" marker-end="url(#r)"/><text class="m" x="930" y="632">Deny locally</text>
<rect class="ok" x="335" y="485" width="230" height="95" rx="10"/><text class="h" x="450" y="520" text-anchor="middle">9. Local Execution</text><text class="t" x="450" y="546" text-anchor="middle">Execute + Progress + Result</text><line class="green" x1="620" y1="532" x2="565" y2="532" marker-end="url(#g)"/>
<rect class="box" x="70" y="485" width="210" height="95" rx="10"/><text class="h" x="175" y="520" text-anchor="middle">10. Result</text><text class="t" x="175" y="546" text-anchor="middle">Normalize and return</text><line class="line" x1="335" y1="532" x2="280" y2="532" marker-end="url(#a)"/>

<rect class="box" x="335" y="690" width="830" height="105" rx="10"/><text class="h" x="750" y="728" text-anchor="middle">11. Activity / Audit</text><text class="t" x="750" y="754" text-anchor="middle">Request · Policy decision · Approval · Execution · Result · Duration · Error</text><text class="m" x="750" y="778" text-anchor="middle">Visible from Web Console and traceable by request_id</text>
<path class="line" d="M450 580 C450 640,600 660,600 690" marker-end="url(#a)"/><path class="line" d="M700 405 C700 620,760 640,760 690" marker-end="url(#a)"/>

<rect class="deny" x="70" y="690" width="210" height="105" rx="10"/><text class="h" x="175" y="728" text-anchor="middle">Kill Switch</text><text class="t" x="175" y="754" text-anchor="middle">Pause / Cancel / Disconnect</text><text class="m" x="175" y="778" text-anchor="middle">Always higher priority than AI</text>
<path class="red" d="M280 742 C310 742,320 650,400 580" marker-end="url(#r)"/>
<text class="m" x="54" y="880">Target rule: no remote AI request bypasses policy, local enforcement, user pause, or audit.</text>
</svg>