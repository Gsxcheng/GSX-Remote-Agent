<text class="title" x="54" y="440">First end-to-end milestone</text>
<rect class="milestone" x="55" y="475" width="1330" height="165" rx="14"/>
<text class="h" x="90" y="515">Windows PC installs GSX Agent</text><text class="t" x="90" y="545">→ Device appears Online in Web Console</text><text class="t" x="90" y="573">→ ChatGPT sends MCP tool call: device.health</text><text class="t" x="90" y="601">→ Control Plane routes request to the selected Agent</text><text class="t" x="735" y="545">→ Agent performs local policy check</text><text class="t" x="735" y="573">→ Result returns to ChatGPT</text><text class="t" x="735" y="601">→ Web Activity shows request, decision, result and duration</text>

<text class="h" x="54" y="700">Implementation guardrails</text>
<text class="t" x="54" y="730">• Do not start with a large desktop dashboard.  • Do not build a custom relay before the local/control-plane loop works.</text>
<text class="t" x="54" y="758">• Do not add capabilities that bypass Policy / Audit.  • Web Console owns management UX; Agent owns local execution.</text>
</svg>